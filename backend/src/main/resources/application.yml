spring:
  application:
    name: backend
  jackson:
    deserialization:
      fail-on-null-for-primitives: true
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vibebass}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    
  flyway:
    baseline-on-migrate: false
    clean-disabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8082

# YouTube Data API v3 연동 설정
youtube:
  api-key: ${YOUTUBE_API_KEY:}
  search-url: https://www.googleapis.com/youtube/v3/search
